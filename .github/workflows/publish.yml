name: Publish to PyPI

on:
  release:
    types: [published]

# Least-privilege default. The build job only needs to read the repo; the
# publish job overrides this with id-token: write for OIDC (below).
permissions:
  contents: read

jobs:
  # Fail-closed gate: lint, type-check, and tests must pass before anything is
  # built or published. Defense in depth on top of branch-protection — a release
  # can never publish a tree that doesn't pass the suite.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint, type-check, test
        run: |
          ruff check src/ tests/
          mypy src/nyxora
          pytest tests/ -x -q --timeout=60

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build distributions
        run: python -m build

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  # `nyx update` resolves its download from GitHub RELEASE ASSETS, not PyPI, so
  # the built distributions must be attached to the release itself — the PyPI
  # upload below does not do that.
  attach-release-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # scoped to THIS job only, to upload release assets.
                       # Deliberately NOT combined with the publish job's
                       # id-token: write — keep OIDC and release-write separate.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attach wheel + sdist to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no actions/checkout (it needs only the build artifact),
          # so gh cannot infer the target repo from a git remote. GH_REPO gives it
          # explicitly. Without this, `gh release upload` fails with
          # "not a git repository" — which broke the first live run at v3.1.1.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.whl dist/*.tar.gz --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nyxora/
    permissions:
      id-token: write  # Required for OIDC trusted publishing

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
